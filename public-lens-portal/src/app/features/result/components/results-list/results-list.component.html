<section class="results-page" aria-labelledby="results-title">
  <header class="results-header">
    <p class="eyebrow">Explore the responses</p>
    <h1 id="results-title">Survey results</h1>
    <p>Choose a survey to view its response analysis.</p>
  </header>

  <p *ngIf="isLoading" class="status-message" role="status">Loading surveys…</p>

  <div *ngIf="!isLoading && errorMessage" class="error-state" role="alert">
    <p>{{ errorMessage }}</p>
    <button type="button" class="retry-button" (click)="loadSurveys()">Try again</button>
  </div>

  <p *ngIf="!isLoading && !errorMessage && surveys.length === 0" class="status-message">
    There are no surveys available right now.
  </p>

  <div *ngIf="surveys.length > 0" class="survey-grid">
    <a
      *ngFor="let survey of surveys"
      class="survey-card"
      [routerLink]="['/results', survey.id]"
    >
      <h2>{{ survey.surveyName }}</h2>
      <p>{{ survey.description }}</p>
      <span class="survey-link">View analysis <span aria-hidden="true">→</span></span>
    </a>
  </div>
</section>
